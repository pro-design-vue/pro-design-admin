pre-commit:
  parallel: true
  commands:
    lint-md:
      run: npx prettier --cache --ignore-unknown --write {staged_files}
      glob: '*.md'
    lint-vue:
      run: npx prettier --write {staged_files} && npx eslint --cache --fix {staged_files} && npx stylelint --fix --allow-empty-input {staged_files}
      glob: '*.vue'
    lint-js:
      run: npx prettier --cache --ignore-unknown --write {staged_files} && npx eslint --cache --fix {staged_files}
      glob: '*.{js,jsx,ts,tsx}'
    lint-style:
      run: npx prettier --cache --ignore-unknown --write {staged_files} && npx stylelint --fix --allow-empty-input {staged_files}
      glob: '*.{scss,less,styl,html,vue,css}'
    # lint-package:
    #   run: npx prettier --cache --write {staged_files}
    #   glob: 'package.json'
    lint-json:
      run: npx prettier --cache --write --parser json {staged_files}
      glob: '{!(package)*.json,*.code-snippets,.!(browserslist)*rc}'

post-merge:
  commands:
    install:
      run: npm install

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit $1
